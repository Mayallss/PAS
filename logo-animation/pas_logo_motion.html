<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAS Logo Motion</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--ink:#1d1d1f;--blue:#1230e6;--green:#1f9d55;--yellow:#f6c21c;--red:#e5322d}
html,body{margin:0;height:100%;background:var(--bg)}
body{display:grid;place-items:center;overflow:hidden}
svg{width:100vw;height:100vh;display:block}
.pas{font-family:"Inter Display","Inter",system-ui,sans-serif;font-weight:800;font-size:330px;fill:var(--blue)}
.tag{font-family:"Inter","Inter Display",system-ui,sans-serif;font-weight:300;font-size:40px;fill:var(--ink)}
</style></head>
<body>
<svg id="s" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet">
<defs>
  <filter id="b0" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur id="bl0" stdDeviation="0"/></filter>
  <filter id="b1" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur id="bl1" stdDeviation="0"/></filter>
  <filter id="b2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur id="bl2" stdDeviation="0"/></filter>
  <mask id="mg" maskUnits="userSpaceOnUse"><path id="mgp" d="M570,745 C790,640 1070,570 1470,515" fill="none" stroke="#fff" stroke-width="120" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/></mask>
  <mask id="my" maskUnits="userSpaceOnUse"><path id="myp" d="M620,785 C830,690 1080,625 1430,560" fill="none" stroke="#fff" stroke-width="80" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/></mask>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".4"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="txtclip"><text class="pas" x="752" y="560" text-anchor="middle">P</text><text class="pas" x="960" y="560" text-anchor="middle">A</text><text class="pas" x="1170" y="560" text-anchor="middle">S</text></clipPath>
</defs>
<g id="all"><g transform="translate(-45,-60)">
  <!-- swoosh -->
  <path mask="url(#mg)" fill="var(--green)" d="M590,740 C770,632 1050,556 1450,516 C1070,586 810,660 590,740 Z"/>
  <path mask="url(#my)" fill="var(--yellow)" d="M640,778 C830,688 1080,620 1405,562 C1090,640 860,708 640,778 Z"/>
  <!-- letters -->
  <g id="letters">
    <text id="l0" class="pas" filter="url(#b0)" x="0" y="560" text-anchor="middle">P</text>
    <text id="l1" class="pas" filter="url(#b1)" x="0" y="560" text-anchor="middle">A</text>
    <text id="l2" class="pas" filter="url(#b2)" x="0" y="560" text-anchor="middle">S</text>
  </g>
  <g clip-path="url(#txtclip)"><rect id="sh" x="-400" y="250" width="300" height="360" fill="url(#shine)" transform="skewX(-18)"/></g>
  <!-- tagline -->
  <text id="tag" class="tag" x="960" y="850" text-anchor="middle" letter-spacing="6">Account as a Consult</text>
  <path id="red" d="M730,885 L1030,885 L1046,872 L1054,898 L1070,885 L1190,885" fill="none" stroke="var(--red)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
</g></g>
</svg>
<script>
const DUR=6.6, $=id=>document.getElementById(id);
const cl=x=>Math.max(0,Math.min(1,x));
const p=(t,a,b)=>cl((t-a)/(b-a));
const outExpo=x=>x===1?1:1-Math.pow(2,-10*x);
const inOutCubic=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const outCubic=x=>1-Math.pow(1-x,3);
const X=[752,960,1170];
function render(t){
  // letters: blur-to-sharp rise, staggered
  for(let i=0;i<3;i++){
    const k=outExpo(p(t,.35+i*.14,1.45+i*.14));
    const el=$('l'+i);
    el.setAttribute('x',X[i]);
    el.setAttribute('transform',`translate(0,${(1-k)*60})`);
    el.style.opacity=k;
    $('bl'+i).setAttribute('stdDeviation',(1-k)*18);
  }
  $('mgp').setAttribute('stroke-dashoffset',1-inOutCubic(p(t,1.15,2.25)));
  $('myp').setAttribute('stroke-dashoffset',1-inOutCubic(p(t,1.3,2.4)));
  const g=outCubic(p(t,2.15,3.05));
  const tag=$('tag'); tag.style.opacity=g; tag.setAttribute('letter-spacing',6+(1-g)*16);
  $('red').setAttribute('stroke-dashoffset',1-inOutCubic(p(t,2.6,3.45)));
  // shine
  const s=inOutCubic(p(t,3.7,4.7)); $('sh').setAttribute('x',300+s*1500);
  // outro
  const o=inOutCubic(p(t,5.75,6.45));
  const all=$('all'); all.style.opacity=1-o;
  all.setAttribute('transform',`translate(960 600) scale(${1-o*.03}) translate(-960 -600)`);
}
window.render=render;
if(!/capture/.test(location.search)){
  let t0=null;const loop=ts=>{if(t0===null)t0=ts;render(((ts-t0)/1000)%DUR);requestAnimationFrame(loop)};
  (document.fonts?document.fonts.ready:Promise.resolve()).then(()=>requestAnimationFrame(loop));
} else render(0);
</script>
</body></html>
