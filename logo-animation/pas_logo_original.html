<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAS Logo Motion</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--blue:#0a14f0;--green:#1c9a3c;--yellow:#f7c400;--red:#e51c1c}
html,body{margin:0;height:100%;background:var(--bg)}
body{display:grid;place-items:center;overflow:hidden}
svg{width:100vw;height:100vh;display:block}
.pas{font-family:"Times New Roman","Liberation Serif","Tinos",serif;font-weight:700;font-size:150px;fill:var(--blue)}
.tag{font-family:"Times New Roman","Liberation Serif","Tinos",serif;font-style:italic;font-weight:400;font-size:31px;fill:var(--blue)}
</style></head>
<body>
<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet">
<defs>
  <filter id="b0" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur id="bl0" stdDeviation="0"/></filter>
  <filter id="b1" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur id="bl1" stdDeviation="0"/></filter>
  <filter id="b2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur id="bl2" stdDeviation="0"/></filter>
  <mask id="mg" maskUnits="userSpaceOnUse" x="-50" y="-50" width="600" height="400"><path id="mgp" d="M45,212 C115,142 220,84 350,42" fill="none" stroke="#fff" stroke-width="62" stroke-linecap="butt" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/></mask>
  <mask id="my" maskUnits="userSpaceOnUse" x="-50" y="-50" width="600" height="400"><path id="myp" d="M92,220 C155,160 230,108 340,56" fill="none" stroke="#fff" stroke-width="40" stroke-linecap="butt" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/></mask>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="txtclip"><text class="pas" x="10" y="102">P</text><text class="pas" x="118" y="102">A</text><text class="pas" x="252" y="102">S</text></clipPath>
</defs>
<g id="all">
<g transform="translate(228 222) scale(3)">
  <!-- swoosh (behind letters) -->
  <path mask="url(#mg)" fill="var(--green)" d="M38,200 C92,138 200,78 340,45 C232,84 135,142 80,203 Z"/>
  <path mask="url(#my)" fill="var(--yellow)" d="M84,206 C136,157 220,104 332,58 C236,110 158,160 106,208 Z"/>
  <!-- letters -->
  <text id="l0" class="pas" filter="url(#b0)" x="10" y="102">P</text>
  <text id="l1" class="pas" filter="url(#b1)" x="118" y="102">A</text>
  <text id="l2" class="pas" filter="url(#b2)" x="252" y="102">S</text>
  <g clip-path="url(#txtclip)"><rect id="sh" x="-200" y="-10" width="90" height="130" fill="url(#shine)" transform="skewX(-18)"/></g>
  <!-- tagline -->
  <g id="tg1"><text class="tag" x="148" y="172" style="font-size:37px">Account as</text></g>
  <g id="tg2"><text class="tag" x="200" y="205" style="font-size:40px">a Consult</text></g>
  <path id="red" d="M150,189 L325,177 L335,157 L339,174 L452,152" fill="none" stroke="var(--red)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
</g>
</g>
</svg>
<script>
const DUR=6.6, $=id=>document.getElementById(id);
const cl=x=>Math.max(0,Math.min(1,x)), p=(t,a,b)=>cl((t-a)/(b-a));
const outExpo=x=>x===1?1:1-Math.pow(2,-10*x);
const inOutCubic=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const outCubic=x=>1-Math.pow(1-x,3);
function render(t){
  for(let i=0;i<3;i++){
    const k=outExpo(p(t,.35+i*.14,1.45+i*.14)), el=$('l'+i);
    el.setAttribute('transform',`translate(0,${(1-k)*20})`); el.style.opacity=k;
    $('bl'+i).setAttribute('stdDeviation',(1-k)*6);
  }
  $('mgp').setAttribute('stroke-dashoffset',1-inOutCubic(p(t,1.1,2.2)));
  $('myp').setAttribute('stroke-dashoffset',1-inOutCubic(p(t,1.25,2.35)));
  const a=outCubic(p(t,2.1,2.9)), b=outCubic(p(t,2.3,3.1));
  $('tg1').style.opacity=a; $('tg1').setAttribute('transform',`translate(${(1-a)*-14},0)`);
  $('tg2').style.opacity=b; $('tg2').setAttribute('transform',`translate(${(1-b)*14},0)`);
  $('red').setAttribute('stroke-dashoffset',1-inOutCubic(p(t,2.7,3.5)));
  $('sh').setAttribute('x',-60+inOutCubic(p(t,3.7,4.7))*480);
  const o=inOutCubic(p(t,5.75,6.45)), all=$('all');
  all.style.opacity=1-o; all.setAttribute('transform',`translate(960 540) scale(${1-o*.03}) translate(-960 -540)`);
}
window.render=render;
if(!/capture/.test(location.search)){
  let t0=null;const loop=ts=>{if(t0===null)t0=ts;render(((ts-t0)/1000)%DUR);requestAnimationFrame(loop)};
  (document.fonts?document.fonts.ready:Promise.resolve()).then(()=>requestAnimationFrame(loop));
} else render(0);
</script>
</body></html>
