name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pas
          POSTGRES_PASSWORD: pas_ci_only
          POSTGRES_DB: pas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pas -d pas" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pas:pas_ci_only@localhost:5432/pas
      TEST_DATABASE_URL: postgresql://pas:pas_ci_only@localhost:5432/pas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit (fail on high/critical)
        run: npm audit --audit-level=high
      - run: npm run generate --workspace @pas/db
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + integration tests (ephemeral database per run)
        run: npm test
      - name: Build
        run: npm run build
